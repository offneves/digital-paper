# General
spring.application.name=notification-ms
server.port=8082

# CORS
app.cors.allowed-origins=http://localhost:5173

# JWT (same secret as auth-ms)
app.jwt.secret=K7mPq2Xv9LdR4sTf8NyWa1BcHu6ZjQeN

# Auth client (audience resolution)
app.auth.base-url=http://localhost:8081
app.internal-api-key=digitalpaper-internal-dev-key

# Database
spring.datasource.url=jdbc:postgresql://localhost:5434/digitalpaper_notification
spring.datasource.username=admin
spring.datasource.password=senha123

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Actuator (Docker healthcheck / readiness)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
