# General
spring.application.name=email-ms
server.port=8083

# CORS
app.cors.allowed-origins=http://localhost:5173

# JWT (same secret as auth-ms)
app.jwt.secret=K7mPq2Xv9LdR4sTf8NyWa1BcHu6ZjQeN

# Frontend (links inside e-mails)
app.frontend-base-url=http://localhost:5173

# Database
spring.datasource.url=jdbc:postgresql://localhost:5435/digitalpaper_email
spring.datasource.username=admin
spring.datasource.password=senha123

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Falhas de processamento (ex.: template quebrado) vão para a DLQ após as tentativas
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# SMTP (Gmail) — credenciais via env: SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD (senha de app)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# E-mail
# Remetente (vazio = conta SMTP; no Gmail precisa ser a própria conta ou um alias verificado)
app.mail.from=
app.mail.from-name=Digital Paper
# true = não envia, apenas registra no log (útil sem credenciais SMTP)
app.mail.dry-run=false
# Reenvio automático de falhas de SMTP
app.mail.retry.max-attempts=5
app.mail.retry.initial-delay=1m
app.mail.retry.max-delay=30m
app.mail.retry.poll-interval=30s
app.mail.retry.batch-size=50

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.check-template-location=false

# Actuator (Docker healthcheck / readiness)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.mail.enabled=false
