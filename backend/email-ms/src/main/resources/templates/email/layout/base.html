<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(eyebrow, heading, preheader, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title th:text="${subject}">Digital Paper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Syne:wght@600;700&amp;display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table { border-collapse: collapse; mso-table-lspace: 0; mso-table-rspace: 0; }
        img { border: 0; line-height: 100%; outline: none; text-decoration: none; }
        a { color: inherit; }

        @media only screen and (max-width: 600px) {
            .dp-container { width: 100% !important; }
            .dp-card-pad { padding: 32px 24px 28px !important; }
            .dp-heading { font-size: 28px !important; }
            .dp-footer-cell { display: block !important; width: 100% !important; text-align: left !important; padding-top: 8px !important; }
        }

        @media (prefers-color-scheme: dark) {
            .dp-bg { background-color: #0c0c0e !important; }
            .dp-card { background-color: #1c1c1f !important; border-color: #2e2e33 !important; }
            .dp-fg { color: #fafafa !important; }
            .dp-muted { color: #a1a1aa !important; }
            .dp-mark { background-color: #fafafa !important; }
            .dp-dot { background-color: #fafafa !important; }
            .dp-btn { background-color: #ececee !important; }
            .dp-btn-text { color: #1c1c1f !important; }
            .dp-notice { background-color: #27272a !important; border-color: #2e2e33 !important; }
            .dp-divider { border-color: #2e2e33 !important; }
        }
    </style>
</head>
<body class="dp-bg" style="margin:0; padding:0; background-color:#fafafa;">

    <div data-text-skip style="display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all;" th:text="${preheader}">Prévia</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="dp-bg" style="background-color:#fafafa;">
        <tr>
            <td align="center" style="padding:48px 16px;">

                <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" class="dp-container" style="width:560px; max-width:560px;">

                    <tr>
                        <td style="padding:0 4px 20px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td valign="middle" style="font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;">
                                        <span class="dp-dot" style="display:inline-block; width:8px; height:8px; border-radius:9999px; background-color:#09090b; vertical-align:middle;"></span>
                                        <span class="dp-muted" style="display:inline-block; margin-left:10px; font-size:11px; font-weight:500; letter-spacing:2.4px; text-transform:uppercase; color:#71717a; vertical-align:middle;">Workspace</span>
                                    </td>
                                    <td align="right" valign="middle" class="dp-muted" style="font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#71717a;">
                                        Digital Paper
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td class="dp-card" style="background-color:#ffffff; border:1px solid #e4e4e7; border-radius:14px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td class="dp-card-pad" style="padding:44px 44px 40px; font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;">

                                        <p class="dp-muted" style="margin:0 0 12px; font-size:11px; font-weight:500; letter-spacing:2.4px; text-transform:uppercase; color:#71717a;" th:if="${eyebrow != null}" th:text="${eyebrow}">Acesso</p>

                                        <h1 class="dp-fg dp-heading" style="margin:0; font-family:'Syne','Helvetica Neue',Helvetica,Arial,sans-serif; font-size:34px; line-height:1.05; font-weight:700; letter-spacing:-1.3px; color:#09090b;" th:text="${heading}">Título</h1>

                                        <div class="dp-mark" style="width:112px; height:1px; line-height:1px; font-size:0; background-color:#09090b; margin:24px 0 28px;">&nbsp;</div>

                                        <th:block th:replace="${content}"></th:block>

                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:24px 4px 0;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td class="dp-muted dp-footer-cell" valign="bottom" style="font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif; font-size:13px; line-height:1.6; color:#71717a;">
                                        Documentos com clareza.<br>Processos com ritmo.
                                    </td>
                                    <td class="dp-fg dp-footer-cell" align="right" valign="bottom" style="font-family:'Syne','Helvetica Neue',Helvetica,Arial,sans-serif; font-size:14px; font-weight:600; letter-spacing:-0.3px; color:#09090b; white-space:nowrap;">
                                        dp —
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2" class="dp-divider" style="border-top:1px solid #e4e4e7;">
                                        <p class="dp-muted" style="margin:16px 0 0; font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:#71717a;">
                                            Mensagem automática — não responda este e-mail
                                        </p>
                                        <p class="dp-muted" style="margin:6px 0 0; font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:#71717a;">
                                            © <span th:text="${year}">2026</span> Digital Paper
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>
</body>
</html>
